[package]
name = "ibc-local"
version = { workspace = true }
repository = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = ["Ken Talley <4344285+kwtalley@users.noreply.github.com"]

exclude = [
    "ibc_local.wasm",
    "checksums.txt",
]

[lib]
crate-type = ["cdylib", "rlib"]

# Unique example name so a workspace build does not collide on target/debug/examples/schema.
[[example]]
name = "ibc-local-schema"
path = "examples/schema.rs"

[features]
backtraces = []

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["exports"] }
cw-storage-plus = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
